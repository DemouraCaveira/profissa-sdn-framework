[project]
name = "profissa-sdn-framework"
version = "0.1.0"
description = "SDN experiment orchestration platform"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["."]
known_first_party = ["monitor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --maxfail=1 --cov=monitor --cov-report=term-missing --cov-fail-under=70"
