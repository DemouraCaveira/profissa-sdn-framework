version: "0.1.0"
topology:
  id: topo-s1
  name: Two hosts and one switch
  controller: ryu
  nodes:
    - id: h1
      type: host
      mgmt_ip: 10.0.0.1
    - id: h2
      type: host
      mgmt_ip: 10.0.0.2
    - id: s1
      type: switch
  links:
    - source: h1
      target: s1
      bandwidth_mbps: 1000
      delay_ms: 1
    - source: h2
      target: s1
      bandwidth_mbps: 1000
      delay_ms: 1
  meta:
    env: lab
experiments:
  - id: exp-latency
    name: Latency ping
    topology_id: topo-s1
    description: Baseline RTT between h1 and h2
    hypotheses: RTT under 5ms
    traffic:
      - generator: ping
        src: h1
        dst: h2
        protocol: icmp
        duration_sec: 30
    metrics:
      metrics:
        - latency_ms
        - packet_loss_pct
        - jitter_ms
      interval_sec: 5
      labels:
        - experiment_id
        - run_id
        - topology_id
        - src
        - dst
    duration_sec: 60
    tags:
      - example
      - latency
    template_version: "0.1.0"
